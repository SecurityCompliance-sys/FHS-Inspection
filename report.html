<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>รายงานประจำสัปดาห์ · FHS Inspection</title>
<meta name="description" content="รายงานสรุปการตรวจสอบสถานีหัวดับเพลิงประจำสัปดาห์ — BevChain Thailand, Security & Compliance">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="light">
<meta name="format-detection" content="telephone=no">
<meta name="theme-color" content="#15234A">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bai+Jamjuree:wght@500;600;700&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<script defer src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
<style>
:root{
  --bg:#E9ECF2;--surface:#FFFFFF;--surface-2:#F4F6FA;--ink:#0F1A2E;--navy:#15234A;--navy-2:#1E2761;
  --red:#D62828;--red-deep:#9B1B1B;--amber:#E65100;--green:#0E8A5F;--line:#D7DDE8;--muted:#64708A;--ice:#CADCFC;
  --shadow:0 1px 2px rgba(15,26,46,.06),0 8px 24px rgba(15,26,46,.08);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:"IBM Plex Sans Thai",sans-serif;background:var(--bg);color:var(--ink);line-height:1.5;font-size:15px}
.mono{font-family:"IBM Plex Mono",monospace;letter-spacing:.02em}
.hazard{height:6px;background:repeating-linear-gradient(135deg,var(--amber) 0 14px,var(--ink) 14px 28px)}
.topbar{background:var(--navy);color:#fff;padding:14px 20px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:30}
.logo{display:flex;align-items:center;gap:10px}.logo svg{width:30px;height:30px}
.logo b{font-family:"Bai Jamjuree";font-weight:700;font-size:15px;line-height:1.1}
.logo span{display:block;font-size:10.5px;color:var(--ice);font-weight:500;letter-spacing:.04em}
.topbar .right{margin-left:auto;display:flex;align-items:center;gap:14px;font-size:12px;color:var(--ice)}
.topbar .right a{color:#fff;cursor:pointer;font-weight:600}
.appsw{display:flex;gap:3px;background:rgba(255,255,255,.08);padding:3px;border-radius:10px;margin-left:8px;overflow-x:auto;-webkit-overflow-scrolling:touch}
.appsw a{padding:6px 12px;border-radius:7px;font-size:13px;font-weight:600;color:var(--ice);text-decoration:none;font-family:"Bai Jamjuree";white-space:nowrap;transition:background .12s}
.appsw a:hover{background:rgba(255,255,255,.12);color:#fff}
.appsw a.cur{background:#fff;color:var(--navy)}
.wrap{max-width:920px;margin:0 auto;padding:22px 18px 60px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:11px 18px;border:none;border-radius:10px;font:inherit;font-weight:600;font-size:14px;cursor:pointer;font-family:"Bai Jamjuree";transition:filter .15s,transform .08s}
.btn:active{transform:scale(.98)}
.btn-primary{background:var(--navy);color:#fff}.btn-primary:hover{filter:brightness(1.13)}
.btn-green{background:var(--green);color:#fff}.btn-ghost{background:var(--surface);color:var(--navy);border:1.5px solid var(--line)}
.btn-sm{padding:8px 14px;font-size:13px;border-radius:9px}
.btn:disabled{opacity:.5;cursor:not-allowed}
input,select{padding:10px 13px;border:1.5px solid var(--line);border-radius:10px;font:inherit;font-size:14px;background:var(--surface);color:var(--ink)}
label{display:block;font-size:13px;font-weight:600;color:var(--navy);margin:0 0 6px}

.toolbar{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:18px;box-shadow:var(--shadow)}
.toolbar .grow{flex:1}

.report{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}
.r-head{background:linear-gradient(135deg,var(--navy),var(--navy-2));color:#fff;padding:22px 24px;position:relative;overflow:hidden}
.r-head::after{content:"";position:absolute;right:-40px;top:-40px;width:160px;height:160px;border-radius:50%;background:rgba(202,220,252,.08)}
.r-head .et{font-family:"Bai Jamjuree";font-weight:700;font-size:23px}
.r-head .ep{color:var(--ice);font-size:13px;margin-top:4px}
.r-head .badge-site{display:inline-block;margin-top:10px;background:rgba(255,255,255,.14);padding:4px 12px;border-radius:20px;font-size:12px;font-weight:600}

.sec{padding:20px 24px;border-bottom:1px solid var(--line)}
.sec:last-child{border-bottom:none}
.sec h3{font-family:"Bai Jamjuree";font-weight:700;font-size:16px;color:var(--navy);margin-bottom:14px;display:flex;align-items:center;gap:8px}

.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.kpi{border:1px solid var(--line);border-radius:11px;padding:14px;text-align:center;position:relative}
.kpi .v{font-family:"Bai Jamjuree";font-weight:700;font-size:26px;line-height:1}
.kpi .l{font-size:11.5px;color:var(--muted);margin-top:5px;font-weight:600}
.kpi .d{font-size:11px;font-weight:700;margin-top:5px}
.kpi .d.up{color:var(--green)}.kpi .d.down{color:var(--red)}.kpi .d.flat{color:var(--muted)}
.kpi.green .v{color:var(--green)}.kpi.red .v{color:var(--red)}.kpi.amber .v{color:var(--amber)}.kpi.navy .v{color:var(--navy-2)}

table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;padding:9px 11px;background:var(--surface-2);color:var(--navy);font-weight:600;font-size:11.5px;border-bottom:1px solid var(--line)}
td{padding:9px 11px;border-bottom:1px solid var(--line);vertical-align:middle}
.tag{font-weight:600}.tag.fail,.tag.needs_repair{color:var(--red)}.tag.pass{color:var(--green)}
.thumb{width:42px;height:42px;border-radius:7px;object-fit:cover;border:1px solid var(--line);cursor:pointer}
.thumbs{display:flex;gap:4px}
.badge{font-size:10.5px;font-weight:600;padding:2px 8px;border-radius:20px;display:inline-block;white-space:nowrap}
.badge.green{background:rgba(14,138,95,.13);color:var(--green)}.badge.red{background:rgba(214,40,40,.1);color:var(--red)}
.badge.amber{background:rgba(230,81,0,.13);color:var(--amber)}.badge.navy{background:rgba(30,39,97,.1);color:var(--navy-2)}.badge.gray{background:#EEF1F6;color:var(--muted)}

/* photo comparison C5 */
.cmp{border:1px solid var(--line);border-radius:11px;padding:12px;margin-bottom:12px}
.cmp .ct{font-weight:600;font-size:13.5px;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.cmp-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.cmp-col .cl{font-size:11px;color:var(--muted);font-weight:600;margin-bottom:5px;text-transform:uppercase;letter-spacing:.04em}
.cmp-col img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:8px;border:1px solid var(--line);cursor:pointer}
.cmp-col .no{aspect-ratio:4/3;border:1.5px dashed var(--line);border-radius:8px;display:grid;place-items:center;color:var(--muted);font-size:12px}

.empty{text-align:center;padding:30px;color:var(--muted);font-size:13.5px}
.ok-line{display:flex;align-items:center;gap:8px;color:var(--green);font-size:13.5px;font-weight:500;padding:8px 0}
.alert{padding:11px 14px;border-radius:10px;font-size:13px;font-weight:500;margin-bottom:14px}
.alert.err{background:rgba(214,40,40,.08);color:var(--red-deep);border:1px solid rgba(214,40,40,.25)}
.alert.ok{background:rgba(14,138,95,.1);color:var(--green);border:1px solid rgba(14,138,95,.25)}
.alert.info{background:rgba(30,39,97,.07);color:var(--navy-2);border:1px solid rgba(30,39,97,.18)}
.hint{font-size:12px;color:var(--muted);margin-top:5px}
.spinner{width:18px;height:18px;border:2.5px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.list-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.list-row:last-child{border:none}

#gate{position:fixed;inset:0;background:var(--bg);z-index:100;display:grid;place-items:center;padding:20px}
#gate .box{background:var(--surface);border-radius:16px;box-shadow:var(--shadow);padding:30px;max-width:380px;width:100%}
#gate h1{font-family:"Bai Jamjuree";font-weight:700;font-size:20px;color:var(--navy);text-align:center;margin-bottom:4px}
#gate p{text-align:center;color:var(--muted);font-size:13px;margin-bottom:20px}

#autoResult{position:fixed;bottom:8px;right:8px;z-index:9999;max-width:70vw;padding:8px 12px;border-radius:8px;
  background:#0F1A2E;color:#CADCFC;font:12px/1.45 "IBM Plex Mono",monospace;word-break:break-word}
#langBtn{border:1px solid rgba(255,255,255,.3);border-radius:7px;padding:4px 9px;font-size:11px;font-weight:700;cursor:pointer}
#langBtn:hover{background:rgba(255,255,255,.12)}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.skip-link{position:absolute;left:-9999px;top:0;z-index:9999;background:var(--navy);color:#fff;padding:10px 16px;border-radius:0 0 10px 0;text-decoration:none}
.skip-link:focus{left:0}
:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation-duration:.001ms!important;transition-duration:.001ms!important}}
@media(max-width:720px){.kpis{grid-template-columns:repeat(2,1fr)}}
@media print{
  body *{visibility:hidden}.hazard,.topbar,.toolbar{display:none!important}
  .wrap{max-width:100%;padding:0}
  .report,.report *{visibility:visible}
  .report{box-shadow:none;border:none;border-radius:0}
  .sec{page-break-inside:avoid}
}
</style>
</head>
<body>
<div class="hazard"></div>

<!-- ช่องสถานะให้สคริปต์รายงานรายสัปดาห์ (scripts/send-weekly.mjs) อ่านผล
     data-status: idle | running | success | partial | failure
     data-ok / data-fail: จำนวนอีเมลที่ส่งสำเร็จ / ล้มเหลว -->
<div id="autoResult" data-status="idle" data-ok="0" data-fail="0" role="status" aria-live="polite" hidden></div>

<a class="skip-link" href="#mainContent" data-i18n="skip_to_content">ข้ามไปที่เนื้อหาหลัก</a>

<div id="gate">
  <div class="box">
    <div style="text-align:center;margin-bottom:16px"><svg width="48" height="48" viewBox="0 0 64 64" fill="none" aria-hidden="true" focusable="false"><path d="M32 6l22 8v16c0 14-9 23-22 28C19 53 10 44 10 30V14l22-8z" fill="#1E2761"/><path d="M22 24h20M22 31h20M22 38h13" stroke="#CADCFC" stroke-width="2.5" stroke-linecap="round"/></svg></div>
    <h1 data-i18n="gate_h">รายงานประจำสัปดาห์</h1><p>Security &amp; Compliance · FHS</p>
    <div id="gateAlert" role="alert" aria-live="assertive"></div>
    <div style="margin-bottom:14px"><label for="gId" data-i18n="f_empid">รหัสพนักงาน</label><input type="text" id="gId" class="mono" style="text-transform:uppercase;width:100%" placeholder="EMP-1001" autocomplete="username"></div>
    <div style="margin-bottom:18px"><label for="gPw" data-i18n="f_pw">รหัสผ่าน</label><input type="password" id="gPw" style="width:100%" placeholder="••••••••" autocomplete="current-password"></div>
    <button class="btn btn-primary" style="width:100%" id="gBtn" type="button" data-i18n="signin">เข้าสู่ระบบ</button>
  </div>
</div>

<div class="topbar">
  <div class="logo"><svg viewBox="0 0 32 32" fill="none"><rect width="32" height="32" rx="7" fill="#1E2761"/><path d="M10 9h12M10 14h12M10 19h8" stroke="#CADCFC" stroke-width="2" stroke-linecap="round"/><circle cx="23" cy="22" r="4" fill="#D62828"/></svg>
    <div><b>Weekly Report</b><span>SECURITY &amp; COMPLIANCE</span></div></div>
  <nav class="appsw" aria-label="สลับหน้าจอ / App switcher">
    <a href="index.html" data-i18n="nav_inspect">ตรวจ</a>
    <a href="dashboard.html">Dashboard</a>
    <a href="report.html" class="cur" aria-current="page" data-i18n="nav_report">รายงาน</a>
    <a href="admin.html">Admin</a>
    <a href="manual-inspector.html" data-i18n="nav_manual">คู่มือ</a>
  </nav>
  <div class="right">
    <a id="langBtn" role="button" tabindex="0" aria-label="Switch language">EN</a>
    <span id="adminName"></span>
    <a id="logout" data-i18n="signout">ออก</a>
  </div>
</div>

<main class="wrap" id="mainContent">
  <div class="toolbar">
    <div><label for="period" data-i18n="tb_period">ช่วงเวลา</label><select id="period"><option value="0" data-i18n="p_this">สัปดาห์นี้</option><option value="1" selected data-i18n="p_last">สัปดาห์ที่แล้ว</option><option value="2" data-i18n="p_2ago">2 สัปดาห์ก่อน</option></select></div>
    <div class="grow"></div>
    <button class="btn btn-ghost btn-sm" id="btnPrint" type="button" data-i18n="btn_print">🖨 พิมพ์ / PDF</button>
    <button class="btn btn-green btn-sm" id="btnSend" type="button" data-i18n="btn_send">📧 ส่งอีเมล</button>
  </div>
  <div id="sendAlert" role="status" aria-live="polite"></div>
  <div class="report" id="report"><div class="empty" data-i18n="loading">กำลังโหลดข้อมูล…</div></div>
</main>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
import { getFirestore, doc, getDoc, collection, getDocs, query, where, orderBy, Timestamp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';

/* ===== CONFIG — รวมไว้ที่ src/config.js ที่เดียว (อย่าก็อปค่ามาวางซ้ำ) ===== */
import { FIREBASE_CONFIG, EMAILJS, SITE_RECIPIENTS, isPlaceholder, parseRecipients, PAGES, pageUrl } from './src/config.js';
import { esc, cld, thumb, sha256, tsDate, fmt, fmtD, readAdminSession, writeAdminSession,
         clearAdminSession, verifyAdminSession } from './src/shared.js';
import { createI18n, mergeDict } from './src/i18n.js';

const app=initializeApp(FIREBASE_CONFIG); const db=getFirestore(app);
const $=id=>document.getElementById(id);

/* ===== i18n (TH / EN) — ใช้คีย์ fhs_lang ร่วมกับ dashboard / admin ===== */
const i18n = createI18n(mergeDict({
 th:{
  gate_h:'รายงานประจำสัปดาห์', tb_period:'ช่วงเวลา', p_this:'สัปดาห์นี้', p_last:'สัปดาห์ที่แล้ว', p_2ago:'2 สัปดาห์ก่อน',
  btn_print:'🖨 พิมพ์ / PDF', btn_send:'📧 ส่งอีเมล', sending:'กำลังส่ง…',
  send_adminonly:'เฉพาะผู้ใช้สิทธิ์ admin เท่านั้นที่ส่งอีเมลได้', send_norecip:'ไม่มีผู้รับที่ตั้งค่าไว้ใน SITE_RECIPIENTS',
  send_noconf:'ยังไม่ได้ตั้งค่า EmailJS (publicKey / serviceId / templateId) ที่ src/config.js',
  send_ok:'ส่งสำเร็จ', send_fail:'ล้มเหลว', send_copies:'ฉบับ', send_confirm:'ยืนยันส่งรายงานให้ผู้รับ',
  sess_expired:'เซสชันหมดอายุหรือสิทธิ์ถูกยกเลิก — กรุณาเข้าสู่ระบบใหม่',
 },
 en:{
  gate_h:'Weekly Report', tb_period:'Period', p_this:'This week', p_last:'Last week', p_2ago:'2 weeks ago',
  btn_print:'🖨 Print / PDF', btn_send:'📧 Send email', sending:'Sending…',
  send_adminonly:'Only admin users can send emails', send_norecip:'No recipients configured in SITE_RECIPIENTS',
  send_noconf:'EmailJS is not configured (publicKey / serviceId / templateId) in src/config.js',
  send_ok:'Sent', send_fail:'failed', send_copies:'copies', send_confirm:'Send the report to',
  sess_expired:'Your session expired or your access was revoked — please sign in again',
 }
}), { onChange: () => { if (ADMIN) renderReport(); } });

const t  = (k) => i18n.t(k);
/* helper สองภาษาแบบ inline — ใช้ชื่อ TL ไม่ใช่ L เพราะ L ชนกับ Leaflet (บทเรียนจาก PR #18) */
const TL = (en, th) => i18n.TL(en, th);
/* ตัวช่วยวันเวลา: ของ src/shared.js รับ lang เป็นพารามิเตอร์ที่สอง จึงต้องส่งภาษา
 * ปัจจุบันเข้าไป — ตั้งชื่อใหม่ *_L ไม่ใช่ทับชื่อที่ import มา เพราะ import binding
 * เป็นค่าคงที่ เขียนทับไม่ได้ (จะ TypeError ตอนโหลดหน้า) */
const fmtDL = (d) => fmtD(d, i18n.lang);   // วันที่แบบสั้น เช่น 12 ต.ค. 69
const fmtTL = (d) => fmt(d, i18n.lang);    // วันที่ + เวลา เช่น 12 ต.ค. 14:30
/* cld() / thumb() มาจาก src/shared.js — จัดการ transform ที่มีอยู่เดิมได้ถูกต้อง
 * (ของเดิม replace ตรง ๆ ทำให้ URL ที่มี transform อยู่แล้วซ้อนกัน) */
function weekRange(off=0){ const n=new Date(); const day=(n.getDay()+6)%7; const mon=new Date(n); mon.setDate(n.getDate()-day-off*7); mon.setHours(0,0,0,0); const end=new Date(mon); end.setDate(mon.getDate()+7); return {start:mon,end}; }

let STATIONS=[],INSPECTIONS=[],CASES=[],ADMIN=null,LAST_REPORT=null;

async function gateLogin(){
  const id=$('gId').value.trim().toUpperCase(),pw=$('gPw').value,a=$('gateAlert');a.innerHTML='';
  if(!id||!pw){a.innerHTML='<div class="alert err">'+esc(t('err_fill'))+'</div>';return;}
  const btn=$('gBtn');btn.disabled=true;btn.innerHTML='<div class="spinner"></div>';
  try{
    const snap=await getDoc(doc(db,'users',id)); if(!snap.exists())throw new Error(t('err_nouser'));
    const u=snap.data();
    if(!['admin','viewer'].includes(u.role))throw new Error(t('err_noaccess'));
    if(u.active===false)throw new Error(t('err_disabled'));
    if((await sha256((u.salt||'')+pw))!==u.passwordHash)throw new Error(t('err_wrongpw'));
    ADMIN={id,name:u.name||id,role:u.role};
    writeAdminSession(ADMIN);
    boot();
  }catch(e){a.innerHTML='<div class="alert err">'+esc(e.message)+'</div>';}
  finally{btn.disabled=false;btn.textContent=t('signin');}
}
async function boot(){
  $('gate').style.display='none'; $('adminName').textContent=ADMIN.name;
  emailjsInit();
  const maxOff=Math.max(...[...$('period').options].map(o=>parseInt(o.value)||0));
  const since=Timestamp.fromDate(weekRange(maxOff+1).start);   // เฉพาะช่วงที่รายงานใช้จริง
  const insQ=query(collection(db,'inspections'),where('createdAt','>=',since),orderBy('createdAt','desc'));
  const [st,ins,cs]=await Promise.all([getDocs(collection(db,'stations')),getDocs(insQ),getDocs(collection(db,'cases'))]);
  STATIONS=st.docs.map(d=>({id:d.id,...d.data()}));
  INSPECTIONS=ins.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(tsDate(b.createdAt)?.getTime()||0)-(tsDate(a.createdAt)?.getTime()||0));
  CASES=cs.docs.map(d=>({id:d.id,...d.data()}));
  renderReport();
}

function inRange(i,r){ const d=tsDate(i.createdAt); return d&&d>=r.start&&d<r.end; }
function compute(off){
  const cur=weekRange(off), prev=weekRange(off+1);
  const ci=INSPECTIONS.filter(i=>inRange(i,cur)), pi=INSPECTIONS.filter(i=>inRange(i,prev));
  const stat=arr=>{ const pass=arr.filter(i=>i.result==='pass').length; const fail=arr.length-pass;
    const issues=arr.reduce((s,i)=>s+(i.missingItems?.length||0),0);
    const stationsDone=new Set(arr.map(i=>i.stationId)).size;
    return {count:arr.length,pass,fail,issues,stationsDone,rate:arr.length?Math.round(pass/arr.length*100):0}; };
  const c=stat(ci), p=stat(pi);
  const uninspected=STATIONS.filter(s=>!ci.some(i=>i.stationId===s.id));
  const failList=ci.filter(i=>i.result!=='pass');
  const newCases=CASES.filter(x=>{ const d=tsDate(x.reportedMissingAt); return d&&d>=cur.start&&d<cur.end; });
  // photo comparison: stations inspected in BOTH weeks
  const cmp=[];
  STATIONS.forEach(s=>{
    const a=ci.find(i=>i.stationId===s.id), b=pi.find(i=>i.stationId===s.id);
    if(a&&b&&(a.photos?.length||b.photos?.length)) cmp.push({s,now:a.photos?.[0]?.url,prev:b.photos?.[0]?.url});
  });
  return {cur,prev,c,p,uninspected,failList,newCases,cmp};
}

function delta(now,was,inv=false){
  const d=now-was; const cls=d===0?'flat':((d>0)!==inv?'up':'down');
  const arrow=d>0?'▲':d<0?'▼':'—';
  return `<div class="d ${cls}">${arrow} ${d>0?'+':''}${d} ${TL('vs last week','จากสัปดาห์ก่อน')}</div>`;
}

      <td style="text-align:center;padding:10px;border:1px solid #eee"><div style="font-size:24px;font-weight:700;color:${rate>=80?green:rate>=50?amber:red}">${rate}%</div><div style="font-size:11px;color:${mut}">อัตราผ่าน</div></td>

/* -------- EmailJS --------
 * isPlaceholder() เช็คค่า YOUR_... ที่ยังไม่ได้ตั้งใน src/config.js */
function emailjsReady(){
  return !isPlaceholder(EMAILJS.publicKey) && !isPlaceholder(EMAILJS.serviceId) && !isPlaceholder(EMAILJS.templateId);
}
function emailjsInit(){
  if(!emailjsReady() || !window.emailjs) return false;
  try{ emailjs.init({ publicKey: EMAILJS.publicKey }); return true; }
  catch(e){ console.error('[emailjs]',e); return false; }
}

/** ส่งหนึ่งฉบับ — ส่งชื่อตัวแปรผู้รับทั้ง to_email และ email
 *  เพราะเทมเพลต EmailJS ของแต่ละบัญชีตั้งชื่อไม่เหมือนกัน
 *  (ของเดิม: ปุ่มมือส่ง {to_email} แต่โค้ด autosend ส่ง {email} → ทางใดทางหนึ่งส่งไม่ออก) */
async function sendOne(to, subject, html){
  return emailjs.send(EMAILJS.serviceId, EMAILJS.templateId,
    { subject, html_content: html, message: html, to_email: to, email: to });
}

/** ไซต์ที่มีข้อมูลในสัปดาห์นั้น + _all (ผู้บริหาร/ส่วนกลาง) */
function buildJobs(off){
  const sitesWithData=[...new Set(INSPECTIONS.filter(i=>inRange(i,weekRange(off))).map(i=>i.site).filter(Boolean))];
  const jobs=[];
  sitesWithData.forEach(site=>{ if(SITE_RECIPIENTS[site]) jobs.push({to:SITE_RECIPIENTS[site],site}); });
  if(SITE_RECIPIENTS._all) jobs.push({to:SITE_RECIPIENTS._all,site:null});
  return jobs;
}

/** ส่งตามรายการ jobs แล้วคืนสรุปผล — ใช้ทั้งปุ่มมือและโหมดอัตโนมัติ */
async function dispatchEmails(off, jobs, opts){
  const dryrun = !!(opts && opts.dryrun);
  let ok=0, fail=0; const errors=[];
  for(const j of jobs){
    const {html,subject}=buildEmailHtml(off,j.site);
    const addrs=parseRecipients(j.to);      // แยกหลายอีเมลเป็นรายบุคคล
    if(!addrs.length){ fail++; errors.push((j.site||'_all')+': no valid address in "'+j.to+'"'); continue; }
    for(const addr of addrs){
      if(dryrun){ console.log('[dryrun] would send →',addr,'|',subject); ok++; continue; }
      try{ await sendOne(addr, subject, html); ok++; }
      catch(e){ fail++; const m=(e&&(e.text||e.message))||String(e); errors.push(addr+': '+m); console.error('[send]',addr,e); }
    }
  }
  return { ok, fail, errors };
}

async function sendEmail(){
  const a=$('sendAlert'); a.innerHTML='';
  const btn=$('btnSend');

  if(ADMIN && ADMIN.role!=='admin'){ a.innerHTML='<div class="alert err">'+esc(t('send_adminonly'))+'</div>'; return; }
  if(!emailjsReady() || !emailjsInit()){ a.innerHTML='<div class="alert err">'+esc(t('send_noconf'))+'</div>'; return; }

  const off=parseInt($('period').value);
  const jobs=buildJobs(off);
  if(!jobs.length){ a.innerHTML='<div class="alert err">'+esc(t('send_norecip'))+'</div>'; return; }

  const total=jobs.reduce((n,j)=>n+parseRecipients(j.to).length,0);
  if(!confirm(t('send_confirm')+' '+total+' ?')) return;

  btn.disabled=true; btn.innerHTML='<div class="spinner"></div>'+esc(t('sending'));
  const {ok,fail,errors}=await dispatchEmails(off, jobs);
  btn.disabled=false; btn.textContent='📧 '+t('btn_send');

  a.innerHTML='<div class="alert '+(fail?'err':'ok')+'">'+esc(t('send_ok'))+' '+ok+' '+esc(t('send_copies'))+
    (fail?' · '+esc(t('send_fail'))+' '+fail:'')+
    (errors.length?'<div style="margin-top:6px;font-size:12px">'+errors.slice(0,3).map(esc).join('<br>')+'</div>':'')+'</div>';
}

/* ============================================================================
 * โหมดส่งอัตโนมัติ (autosend) — เรียกโดย GitHub Actions
 *   report.html?autosend=1&week=1&notify=<email>[&dryrun=1]
 *
 * เดิม automation ทำผ่าน Playwright ที่ต้องล็อกอินด้วยบัญชีจริงแล้วคลิกปุ่ม
 * เปราะและพังทุกครั้งที่ UI เปลี่ยน ตอนนี้หน้าเว็บสั่งตัวเองได้และรายงานผลผ่าน
 * #autoResult (data-status / data-ok / data-fail)
 *
 * หมายเหตุความปลอดภัย: URL นี้ไม่มีการพิสูจน์ตัวตน (ต้องเรียกได้โดยไม่มีคนนั่งเฝ้า)
 * ผลกระทบร้ายที่สุดคือ "ส่งอีเมลซ้ำ" ไม่ใช่การอ่าน/แก้ข้อมูล — ดู README
 * ==========================================================================*/
async function runAutoSend(params){
  const box=$('autoResult'); box.hidden=false;
  const set=(status,msg,extra)=>{ box.setAttribute('data-status',status);
    if(extra) for(const [k,v] of Object.entries(extra)) box.setAttribute('data-'+k,String(v));
    box.textContent='['+status+'] '+msg; console.log('[auto]',status,msg); };
  try{
    const off = Math.min(8, Math.max(0, parseInt(params.get('week')||'1',10)||0));
    const dry = params.get('dryrun')==='1' || params.get('dryrun')==='true';
    const to  = (params.get('notify')||'').trim();
    set('running','init week='+off);
    ADMIN={ id:'autosend', name:TL('Auto weekly','รายงานอัตโนมัติ'), role:'admin' };
    $('gate').style.display='none';
    $('period').value=String(off);

    if(!emailjsReady()){ set('failure','emailjs-not-configured — ตั้งค่าที่ src/config.js'); return; }
    if(!emailjsInit() && !dry){ set('failure','emailjs-sdk-not-loaded'); return; }

    set('running','loading-firestore');
    const maxOff=Math.max(...[...$('period').options].map(o=>parseInt(o.value)||0));
    const since=Timestamp.fromDate(weekRange(maxOff+1).start);
    const insQ=query(collection(db,'inspections'),where('createdAt','>=',since),orderBy('createdAt','desc'));
    const [st,ins,cs]=await Promise.all([getDocs(collection(db,'stations')),getDocs(insQ),getDocs(collection(db,'cases'))]);
    STATIONS=st.docs.map(d=>({id:d.id,...d.data()}));
    INSPECTIONS=ins.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(tsDate(b.createdAt)?.getTime()||0)-(tsDate(a.createdAt)?.getTime()||0));
    CASES=cs.docs.map(d=>({id:d.id,...d.data()}));
    renderReport();

    const jobs=buildJobs(off);
    if(!jobs.length){ set('failure','no-recipients-configured'); return; }
    const total=jobs.reduce((n,j)=>n+parseRecipients(j.to).length,0);
    set('running','sending total='+total+(dry?' (dryrun)':''));

    const {ok,fail,errors}=await dispatchEmails(off, jobs, { dryrun:dry });

    // แจ้งผลกลับ GitHub Actions — ถ้าแจ้งไม่สำเร็จ ห้ามกระทบผลการส่งหลัก
    if(to && !dry){
      const r=weekRange(off), period=fmtDL(r.start)+' – '+fmtDL(new Date(r.end-1));
      const stamp=new Date().toLocaleString('th-TH',{timeZone:'Asia/Bangkok'});
      const verdict = fail===0 ? TL('Success','สำเร็จ') : (ok===0 ? TL('All failed','ล้มเหลวทั้งหมด') : TL('Partially sent','ส่งได้บางส่วน'));
      const body='<div style="font-family:sans-serif;padding:16px;background:#f4f6fa;border-radius:8px;color:#0F1A2E">'+
        '<h3 style="margin:0 0 10px">🤖 FHS weekly report · '+esc(verdict)+'</h3>'+
        '<div>'+TL('Run at','เวลาดำเนินการ')+': '+esc(stamp)+' (Asia/Bangkok)</div>'+
        '<div>'+TL('Period','ช่วงเวลา')+' (week='+off+'): '+esc(period)+'</div>'+
        '<div style="margin-top:8px"><b style="color:#0E8A5F">'+TL('Sent','ส่งสำเร็จ')+' '+ok+'</b> · '+
        '<b style="color:'+(fail?'#D62828':'#64708A')+'">'+TL('Failed','ล้มเหลว')+' '+fail+'</b></div>'+
        (errors.length?'<pre style="background:#fff;border:1px solid #D7DDE8;border-radius:6px;padding:10px;margin-top:8px;font-size:12px;white-space:pre-wrap">'+esc(errors.join('\n'))+'</pre>':'')+'</div>';
      try{ await sendOne(to, '[FHS auto weekly] '+verdict+' · ok:'+ok+' fail:'+fail, body); }
      catch(e){ console.error('[auto][notify]',e); }
    }
    const final = fail===0 ? 'success' : (ok===0 ? 'failure' : 'partial');
    set(final, 'ok='+ok+' fail='+fail+(dry?' (dryrun)':'')+(errors.length?' | '+errors.slice(0,2).join(' | '):''), {ok,fail});
  }catch(e){
    set('failure', ((e&&e.message)?e.message:String(e)).slice(0,300));
    console.error('[auto][fatal]',e);
  }
}

/* ---- บูต ----
 * 1) ?autosend=1 → โหมดอัตโนมัติ (ไม่แตะ session ของผู้ใช้จริง)
 * 2) มี session → ตรวจสิทธิ์กับ Firestore ซ้ำก่อนเชื่อ (ของเดิมเชื่อ sessionStorage
 *    ทันที จึงยังเข้าได้แม้สิทธิ์ถูกถอดไปแล้ว)                                  */
(async function init(){
  const params=new URLSearchParams(location.search);
  if(params.get('autosend')==='1'){ return runAutoSend(params); }

  const s=readAdminSession();
  if(!s) return;                                // ยังไม่ล็อกอิน → แสดงหน้า gate
  const verified=await verifyAdminSession(db);
  if(verified){ ADMIN=verified; boot(); }
  else{
    const a=$('gateAlert');
    if(a) a.innerHTML='<div class="alert warn">'+esc(t('sess_expired'))+'</div>';
  }
})();
</script>
